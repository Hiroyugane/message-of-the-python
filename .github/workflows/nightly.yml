name: Nightly

# Tier 2 (blueprint D2, 7.1 level 2): best effort, never blocks a pull request. The archive
# is built once and run in each image by tools/container/smoke.sh. Rocky Linux is tier 1
# but binary-compatible with AlmaLinux, so it runs here instead of on every PR.
#
# Actions, pinned by commit hash: actions/checkout v7.0.1, actions/setup-python v7.1.0,
# actions/upload-artifact v7.0.2, actions/download-artifact v8.0.2 (all official).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python tools/build_pyz.py
      - run: cp tools/container/smoke.sh dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly
          path: dist/
          if-no-files-found: error
          retention-days: 3

  smoke:
    name: smoke (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - archlinux:latest
          - opensuse/leap:16.0
          - opensuse/tumbleweed
          - alpine:3.22
          - alpine:3.24
          - rockylinux/rockylinux:9
          - rockylinux/rockylinux:10
          - ubuntu:24.04
          - ubuntu:26.04
          - fedora:44
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly
          path: dist
      - name: Smoke inside ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD/dist":/dist:ro "$IMAGE" sh /dist/smoke.sh
