# End of security support per release, read by the module os_eol. A release that is
# missing here gets no row. SUPPORT_END in os-release, where a system sets it, wins over
# this table.
#
# "date" is when the dates below were last checked; MOTP shows it with every date taken
# from here. Change it whenever you check them again.
#
# Sources, checked on 2026-11-25:
# - Debian: the end of long-term support (LTS) on https://wiki.debian.org/LTS, which
#   https://www.debian.org/releases/ repeats; not the extended support sold by third
#   parties.
# - Ubuntu: the end of standard security maintenance on
#   https://ubuntu.com/about/release-cycle, not of Ubuntu Pro. That page gives a month
#   only; the day is Canonical's announced end-of-life day where one was announced, else
#   the last day of that month. Interim releases it no longer lists keep their dates.
# - AlmaLinux: the end of security support on https://wiki.almalinux.org/release-notes/.
# - RHEL and Rocky Linux: the end of maintenance support of the major release (ten years
#   after its release, as AlmaLinux). Red Hat's and Rocky's own pages could not be read
#   by an automated client on the check date; the dates equal AlmaLinux's.
# - Fedora: four weeks after the release N+2, from the Fedora schedules as published on
#   https://endoflife.date; Fedora's own pages refused automated clients on the check
#   date. Check them by hand before a release.
date = "2026-11-25"

[debian]
"10" = "2024-06-30"
"11" = "2026-08-31"
"12" = "2028-06-30"
"13" = "2030-06-30"

