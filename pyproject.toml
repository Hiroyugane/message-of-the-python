[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "message-of-the-python"
dynamic = ["version"]
description = "A customisable message of the day for Linux, written in Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
# The core uses only the standard library (blueprint D23): no runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[project.scripts]
motp = "motp.cli:run"

[tool.setuptools.dynamic]
version = { attr = "motp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "needs_linux_owner: needs Linux ownership, users or groups; runs only on Linux as root (CI containers), skipped elsewhere",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "tools"]
# Vendored code stays byte-identical to its release (src/motp/_vendor/manifest.json).
extend-exclude = ["*.md", ".venv", "src/motp/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests and tools legitimately start processes and use assert; tests fuzz with seeded random.
"tests/**" = ["S101", "S103", "S311", "S603", "S607"]
"tools/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.10"
platform = "linux"
files = ["src", "tests", "tools"]
strict = true
warn_unreachable = true
mypy_path = ["tools"]
# Vendored code is checked by its upstream, not here; its files must stay unchanged.
exclude = ["^src/motp/_vendor/"]

[[tool.mypy.overrides]]
module = ["motp._vendor", "motp._vendor.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false
